<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exter rockt 27 – Startknopf</title>
<style>
  :root {
    --panel: #1c1f24;
    --panel-light: #2a2e35;
    --metal: #3c4248;
    --hazard: #ffcc00;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: radial-gradient(circle at 50% 30%, #2b2f36 0%, #0a0b0d 75%);
    color: #eee;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    text-align: center;
    padding: 20px;
  }

  .title {
    font-size: clamp(1.8rem, 5vw, 3rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.2em;
    text-shadow: 0 0 20px rgba(255, 60, 40, 0.6);
  }

  .subtitle {
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    color: #9aa0a8;
    margin-bottom: 3rem;
    letter-spacing: 0.05em;
  }

  .console {
    position: relative;
    background: linear-gradient(145deg, var(--panel-light), var(--panel));
    border: 6px solid var(--metal);
    border-radius: 24px;
    padding: 60px clamp(30px, 8vw, 90px);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.7),
      inset 0 2px 4px rgba(255, 255, 255, 0.08);
  }

  .console::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px dashed var(--hazard);
    border-radius: 16px;
    opacity: 0.5;
    pointer-events: none;
  }

  .btn-wrap {
    position: relative;
    width: clamp(220px, 40vw, 340px);
    height: clamp(220px, 40vw, 340px);
    margin: 0 auto;
  }

  .btn-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, #6b6f75, #26292d);
    box-shadow:
      0 15px 25px rgba(0, 0, 0, 0.6),
      inset 0 2px 6px rgba(255, 255, 255, 0.2),
      inset 0 -8px 10px rgba(0, 0, 0, 0.5);
  }

  #launchBtn {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff6b5a 0%, #e8291c 40%, #a80f07 85%, #7a0a04 100%);
    box-shadow:
      0 12px 0 #6b0a04,
      0 18px 30px rgba(0, 0, 0, 0.6),
      inset 0 6px 12px rgba(255, 255, 255, 0.35),
      inset 0 -14px 20px rgba(0, 0, 0, 0.45);
    color: #fff9e8;
    font-weight: 900;
    font-size: clamp(1.1rem, 3vw, 1.7rem);
    line-height: 1.25;
    letter-spacing: 0.03em;
    text-shadow: 0 3px 4px rgba(0, 0, 0, 0.5);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    user-select: none;
    animation: pulse 2.2s ease-in-out infinite;
  }

  #launchBtn:hover {
    filter: brightness(1.08);
  }

  #launchBtn:active,
  #launchBtn.pressed {
    transform: translateY(10px);
    box-shadow:
      0 2px 0 #6b0a04,
      0 4px 10px rgba(0, 0, 0, 0.6),
      inset 0 6px 12px rgba(0, 0, 0, 0.4),
      inset 0 -4px 8px rgba(255, 255, 255, 0.1);
    animation: none;
  }

  #launchBtn:disabled {
    cursor: not-allowed;
  }

  @keyframes pulse {
    0%, 100% { box-shadow:
      0 12px 0 #6b0a04,
      0 18px 30px rgba(0,0,0,0.6),
      inset 0 6px 12px rgba(255,255,255,0.35),
      inset 0 -14px 20px rgba(0,0,0,0.45),
      0 0 0 rgba(255, 40, 20, 0); }
    50% { box-shadow:
      0 12px 0 #6b0a04,
      0 18px 30px rgba(0,0,0,0.6),
      inset 0 6px 12px rgba(255,255,255,0.35),
      inset 0 -14px 20px rgba(0,0,0,0.45),
      0 0 40px 10px rgba(255, 40, 20, 0.55); }
  }

  .bolt {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ddd, #777 60%, #333);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.6), 0 2px 3px rgba(0,0,0,0.6);
  }
  .bolt.tl { top: 14px; left: 14px; }
  .bolt.tr { top: 14px; right: 14px; }
  .bolt.bl { bottom: 14px; left: 14px; }
  .bolt.br { bottom: 14px; right: 14px; }

  .status {
    margin-top: 2.5rem;
    min-height: 3.5em;
    font-family: "Courier New", monospace;
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    color: var(--hazard);
    letter-spacing: 0.05em;
  }

  .countdown-number {
    font-size: clamp(4rem, 14vw, 8rem);
    font-weight: 900;
    color: #ff3b2f;
    text-shadow: 0 0 40px rgba(255, 59, 47, 0.9);
    animation: countPop 0.9s ease;
  }

  @keyframes countPop {
    0% { transform: scale(0.3); opacity: 0; }
    30% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .flash-overlay {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }

  .flash-overlay.go {
    animation: flashOut 0.6s ease forwards;
  }

  @keyframes flashOut {
    0% { opacity: 0; }
    40% { opacity: 1; }
    100% { opacity: 1; }
  }

  .rumble {
    animation: shake 0.35s infinite;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, -3px); }
  }

  .footer-note {
    margin-top: 2rem;
    font-size: 0.75rem;
    color: #555;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="title">🚀 Exter rockt 27</div>
  <div class="subtitle">Offizielle Startkonsole &mdash; Freigabe erforderlich</div>

  <div class="console" id="console">
    <div class="btn-wrap">
      <div class="btn-ring"></div>
      <div class="bolt tl"></div>
      <div class="bolt tr"></div>
      <div class="bolt bl"></div>
      <div class="bolt br"></div>
      <button id="launchBtn">EXTER<br>ROCKT<br>27</button>
    </div>
    <div class="status" id="status">Bereit zum Start. Knopf drücken, um live zu gehen.</div>
  </div>

  <div class="footer-note">⚠ Nur für autorisiertes Startpersonal ⚠</div>

  <div class="flash-overlay" id="flash"></div>

  <script>
    const btn = document.getElementById('launchBtn');
    const status = document.getElementById('status');
    const consoleEl = document.getElementById('console');
    const flash = document.getElementById('flash');
    const target = 'https://exter-rockt.de';

    let launching = false;

    btn.addEventListener('click', () => {
      if (launching) return;
      launching = true;
      btn.disabled = true;
      btn.classList.add('pressed');
      consoleEl.classList.add('rumble');

      let count = 3;
      status.innerHTML = '<span class="countdown-number">' + count + '</span>';

      const tick = () => {
        count--;
        if (count > 0) {
          status.innerHTML = '<span class="countdown-number">' + count + '</span>';
          setTimeout(tick, 1000);
        } else {
          status.textContent = '🚀 EXTER ROCKT 27 GEHT LIVE...';
          consoleEl.classList.remove('rumble');
          flash.classList.add('go');
          setTimeout(() => {
            window.location.href = target;
          }, 550);
        }
      };

      setTimeout(tick, 1000);
    });
  </script>

</body>
</html>
